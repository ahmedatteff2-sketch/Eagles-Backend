databases:
  - name: eagles-db
    plan: free
    databaseName: eagles
    user: eagles

services:
  - type: web
    name: eagles-backend
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: eagles-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Render-managed Postgres terminates SSL with a self-signed certificate
      # chain, so strict verification (the secure default introduced in #38)
      # fails with SELF_SIGNED_CERT_IN_CHAIN at boot. The connection still
      # runs over Render's private network and is encrypted; we just can't
      # validate the chain against a public CA bundle. Keep this opt-out
      # scoped to this render.yaml so other deployments stay strict.
      - key: DB_SSL_REJECT_UNAUTHORIZED
        value: "false"
      # CORS_ORIGIN must be set explicitly to your frontend's origin in
      # production — leaving it unset will refuse to start by design.
      # - key: CORS_ORIGIN
      #   value: https://your-frontend-domain.com
