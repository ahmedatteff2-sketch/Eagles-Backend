name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel any in-flight run for the same ref when a new commit is pushed —
# nothing in this workflow benefits from running stale commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint • typecheck • test • build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Real Postgres for the integration tests; lighter than mocking pg/drizzle
    # and catches schema-vs-code drift the unit tests would miss.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eagles
          POSTGRES_PASSWORD: eagles
          POSTGRES_DB: eagles_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://eagles:eagles@localhost:5432/eagles_test
      JWT_ACCESS_SECRET: test_access_secret_at_least_32_characters_long_for_ci
      JWT_REFRESH_SECRET: test_refresh_secret_at_least_32_characters_long_for_ci
      NODE_ENV: test
      PORT: "3000"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install backend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build (server only)
        run: npm run build:server

  frontend:
    name: Frontend (lint • typecheck • build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
